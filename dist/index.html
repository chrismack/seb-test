<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Location Search - Material Design</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      --md-sys-color-primary: rgb(103, 80, 164);
      --md-sys-color-on-primary: rgb(255, 255, 255);
      --md-sys-color-primary-container: rgb(234, 221, 255);
      --md-sys-color-on-primary-container: rgb(33, 0, 94);
      --md-sys-color-secondary: rgb(98, 91, 113);
      --md-sys-color-on-secondary: rgb(255, 255, 255);
      --md-sys-color-secondary-container: rgb(232, 222, 248);
      --md-sys-color-on-secondary-container: rgb(30, 25, 43);
      --md-sys-color-tertiary: rgb(125, 82, 96);
      --md-sys-color-on-tertiary: rgb(255, 255, 255);
      --md-sys-color-tertiary-container: rgb(255, 217, 227);
      --md-sys-color-on-tertiary-container: rgb(55, 11, 30);
      --md-sys-color-error: rgb(186, 26, 26);
      --md-sys-color-on-error: rgb(255, 255, 255);
      --md-sys-color-error-container: rgb(255, 218, 214);
      --md-sys-color-on-error-container: rgb(65, 0, 2);
      --md-sys-color-surface: rgb(254, 247, 255);
      --md-sys-color-on-surface: rgb(29, 27, 32);
      --md-sys-color-surface-variant: rgb(231, 224, 236);
      --md-sys-color-on-surface-variant: rgb(73, 69, 79);
      --md-sys-color-outline: rgb(122, 117, 127);
      --md-sys-color-outline-variant: rgb(202, 196, 208);
      --md-sys-color-surface-container-lowest: rgb(255, 255, 255);
      --md-sys-color-surface-container-low: rgb(247, 242, 250);
      --md-sys-color-surface-container: rgb(243, 237, 247);
      --md-sys-color-surface-container-high: rgb(236, 230, 240);
      --md-sys-color-surface-container-highest: rgb(230, 224, 233);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, var(--md-sys-color-primary) 0%, var(--md-sys-color-tertiary) 100%);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--md-sys-color-on-surface);
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      color: white;
      margin-bottom: 40px;
    }

    .header h1 {
      font-size: 2.5rem;
      font-weight: 500;
      margin-bottom: 10px;
      letter-spacing: -0.5px;
    }

    .header p {
      font-size: 1.1rem;
      opacity: 0.95;
      font-weight: 400;
    }

    md-elevated-card {
      --md-elevated-card-container-color: var(--md-sys-color-surface-container-lowest);
      --md-elevated-card-container-elevation: 3;
      display: block;
      border-radius: 24px;
      overflow: visible;
      background: var(--md-sys-color-surface-container-lowest);
      padding: 0;
    }

    .card-content {
      padding: 32px;
      background: var(--md-sys-color-surface-container-lowest);
      border-radius: 24px;
    }

    .search-section {
      margin-bottom: 0;
    }

    .search-title {
      font-size: 1.5rem;
      font-weight: 500;
      color: var(--md-sys-color-on-surface);
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .search-title .material-icons {
      color: var(--md-sys-color-primary);
    }

    .search-wrapper {
      position: relative;
      margin-bottom: 16px;
    }

    .recent-section {
      display: none;
      margin-bottom: 16px;
      padding: 12px;
      border-radius: 12px;
      background: var(--md-sys-color-surface-container-low);
      border: 1px solid var(--md-sys-color-outline-variant);
    }

    .recent-section.active {
      display: block;
    }

    .recent-title {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--md-sys-color-on-surface-variant);
      margin-bottom: 10px;
      font-size: 0.875rem;
      font-weight: 500;
    }

    .recent-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .recent-item {
      border: none;
      border-radius: 10px;
      padding: 8px 12px;
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface);
      font-size: 0.875rem;
      cursor: pointer;
      min-height: 44px;
    }

    md-filled-text-field {
      width: 100%;
      --md-filled-text-field-container-color: var(--md-sys-color-surface-container-high);
      --md-filled-text-field-focus-active-indicator-color: var(--md-sys-color-primary);
      --md-filled-text-field-hover-active-indicator-color: var(--md-sys-color-primary);
    }

    .dropdown {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      background: var(--md-sys-color-surface-container-highest);
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      max-height: 400px;
      overflow-y: auto;
      z-index: 1000;
      display: none;
      border: 1px solid var(--md-sys-color-outline-variant);
    }

    .dropdown.active {
      display: block;
      animation: slideDown 0.2s ease;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    md-list {
      background: transparent;
      --md-list-container-color: transparent;
    }

    md-list-item {
      --md-list-item-container-color: transparent;
      --md-list-item-hover-state-layer-color: var(--md-sys-color-primary);
      --md-list-item-hover-state-layer-opacity: 0.08;
      border-radius: 12px;
      margin: 4px 8px;
    }

    md-list-item:hover {
      background: var(--md-sys-color-surface-container-high);
    }

    .no-results {
      padding: 24px;
      text-align: center;
      color: var(--md-sys-color-on-surface-variant);
      font-size: 0.95rem;
    }

    md-divider {
      --md-divider-color: var(--md-sys-color-outline-variant);
      margin: 24px 0;
    }

    .result-section {
      display: none;
      animation: fadeIn 0.4s ease;
      padding-top: 24px;
    }

    .result-section.active {
      display: block;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .result-header {
      display: flex;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 32px;
    }

    .result-icon-container {
      width: 64px;
      height: 64px;
      background: var(--md-sys-color-primary-container);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .result-icon-container .material-icons {
      font-size: 32px;
      color: var(--md-sys-color-on-primary-container);
    }

    .result-title {
      flex: 1;
    }

    .result-title h2 {
      font-size: 2rem;
      color: var(--md-sys-color-on-surface);
      margin-bottom: 8px;
      font-weight: 500;
      letter-spacing: -0.5px;
    }

    .result-title .subtitle {
      color: var(--md-sys-color-on-surface-variant);
      font-size: 1rem;
    }

    .result-details {
      display: grid;
      gap: 16px;
    }

    .quick-actions {
      margin-top: 16px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .quick-action-button {
      min-height: 44px;
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: 12px;
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      font-weight: 500;
      padding: 10px 12px;
    }

    .quick-action-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status-confirm {
      margin-top: 12px;
      padding: 12px;
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: 12px;
      background: var(--md-sys-color-surface-container-low);
      display: none;
    }

    .status-confirm.active {
      display: block;
    }

    .status-confirm-text {
      font-size: 0.9rem;
      color: var(--md-sys-color-on-surface);
      margin-bottom: 10px;
    }

    .status-confirm-actions {
      display: flex;
      gap: 8px;
    }

    .feedback-toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      background: var(--md-sys-color-surface-container-highest);
      border: 1px solid var(--md-sys-color-outline-variant);
      color: var(--md-sys-color-on-surface);
      padding: 10px 14px;
      border-radius: 10px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 1200;
      min-width: 180px;
      text-align: center;
    }

    .feedback-toast.active {
      opacity: 1;
    }

    .detail-card {
      background: var(--md-sys-color-surface-container-high);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      align-items: flex-start;
      gap: 16px;
      transition: all 0.2s ease;
      border: 1px solid var(--md-sys-color-outline-variant);
    }

    .detail-card:hover {
      background: var(--md-sys-color-surface-container-highest);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .detail-icon {
      width: 40px;
      height: 40px;
      background: var(--md-sys-color-primary-container);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .detail-icon .material-icons {
      color: var(--md-sys-color-on-primary-container);
      font-size: 24px;
    }

    .detail-content {
      flex: 1;
    }

    .detail-label {
      font-size: 0.75rem;
      color: var(--md-sys-color-on-surface-variant);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .detail-value {
      font-size: 1.125rem;
      color: var(--md-sys-color-on-surface);
      font-weight: 400;
    }

    md-assist-chip {
      --md-assist-chip-container-height: 36px;
      --md-assist-chip-icon-size: 18px;
    }

    md-assist-chip .material-icons {
      font-size: 18px;
    }

    md-assist-chip.help-needed {
      --md-assist-chip-container-color: var(--md-sys-color-error-container);
      --md-assist-chip-label-text-color: var(--md-sys-color-on-error-container);
      --md-assist-chip-icon-color: var(--md-sys-color-on-error-container);
    }

    md-assist-chip.no-help {
      --md-assist-chip-container-color: #E8F5E9;
      --md-assist-chip-label-text-color: #1B5E20;
      --md-assist-chip-icon-color: #1B5E20;
    }

    .empty-state {
      text-align: center;
      padding: 60px 30px;
      color: var(--md-sys-color-on-surface-variant);
    }

    .empty-state-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      background: var(--md-sys-color-surface-container-high);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .empty-state-icon .material-icons {
      font-size: 48px;
      color: var(--md-sys-color-on-surface-variant);
    }

    .empty-state h3 {
      font-size: 1.5rem;
      color: var(--md-sys-color-on-surface);
      margin-bottom: 8px;
      font-weight: 500;
    }

    .empty-state p {
      font-size: 1rem;
      color: var(--md-sys-color-on-surface-variant);
    }

    /* Mobile responsive */
    @media (max-width: 768px) {
      body {
        padding: 16px;
        align-items: flex-start;
        padding-top: 40px;
      }

      .header h1 {
        font-size: 2rem;
      }

      .header p {
        font-size: 1rem;
      }

      .header {
        margin-bottom: 24px;
      }

      .card-content {
        padding: 24px 20px;
      }

      .result-header {
        flex-direction: column;
        gap: 16px;
      }

      .result-title h2 {
        font-size: 1.75rem;
      }

      .detail-card {
        padding: 16px;
      }

      .dropdown {
        max-height: 300px;
      }

      .search-title {
        font-size: 1.25rem;
      }

      .quick-actions {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 480px) {
      .card-content {
        padding: 20px 16px;
      }

      .result-icon-container {
        width: 56px;
        height: 56px;
      }

      .result-icon-container .material-icons {
        font-size: 28px;
      }

      .result-title h2 {
        font-size: 1.5rem;
      }
    }

    /* Scrollbar styling */
    .dropdown::-webkit-scrollbar {
      width: 8px;
    }

    .dropdown::-webkit-scrollbar-track {
      background: var(--md-sys-color-surface-container);
      border-radius: 10px;
    }

    .dropdown::-webkit-scrollbar-thumb {
      background: var(--md-sys-color-outline-variant);
      border-radius: 10px;
    }

    .dropdown::-webkit-scrollbar-thumb:hover {
      background: var(--md-sys-color-outline);
    }

    /* Material Design elevation styles */
    .elevation-1 {
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 1px 3px 1px rgba(0, 0, 0, 0.15);
    }

    .elevation-2 {
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 2px 6px 2px rgba(0, 0, 0, 0.15);
    }

    /* Material Icons styles */
    .material-icons {
      font-family: 'Material Icons';
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      vertical-align: middle;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      font-feature-settings: 'liga';
    }
  </style>
  <script type="module" crossorigin src="./assets/index-DQEzpA-R.js"></script>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Location Finder</h1>
      <p>Search for locations and view their details</p>
    </div>

    <md-elevated-card>
      <div class="card-content">
        <div class="search-section">
          <div class="search-title">
            <span class="material-icons">search</span>
            <span>Search Locations</span>
          </div>

          <div class="search-wrapper">
            <md-filled-text-field
              id="searchInput"
              label="Search for a location"
              type="text"
              autocomplete="off"
            >
              <span class="material-icons" slot="leading-icon">place</span>
            </md-filled-text-field>
            <div class="dropdown" id="dropdown"></div>
          </div>

          <div class="recent-section" id="recentSection">
            <div class="recent-title">
              <span class="material-icons">history</span>
              <span>Recent Locations</span>
            </div>
            <div class="recent-list" id="recentList"></div>
          </div>
        </div>

        <div class="result-section" id="resultSection">
          <div class="empty-state">
            <div class="empty-state-icon">
              <span class="material-icons">location_on</span>
            </div>
            <h3>No location selected</h3>
            <p>Use the search box above to find a location</p>
          </div>
        </div>
      </div>
    </md-elevated-card>
  </div>

  <div class="feedback-toast" id="feedbackToast" role="status" aria-live="polite"></div>

</body>
</html>
